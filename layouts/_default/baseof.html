<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
  <header>
    <a class="name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  </header>
  <div class="layout">
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <aside>
      <nav>
        {{ $current := . }}
        {{ range site.Menus.main }}
          <a href="{{ .URL }}"{{ if eq $current.RelPermalink .URL }} class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </aside>
  </div>
  <footer>© {{ now.Year }} {{ site.Title }}</footer>
</body>
</html>
