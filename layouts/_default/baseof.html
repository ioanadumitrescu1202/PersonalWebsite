<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <link rel="preload" href="{{ "fonts/cormorant-garamond-latin-500-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body class="{{ if .IsHome }}home{{ else }}inner{{ end }}">
  <header class="site-header">
    <nav>
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if eq $current.RelPermalink .URL }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </header>
  {{ block "main" . }}{{ end }}
  <footer class="site-footer">© {{ now.Year }} {{ site.Title }} · Zürich</footer>
</body>
</html>
