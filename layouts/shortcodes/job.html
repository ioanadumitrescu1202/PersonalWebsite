{{- $date := .Get "date" -}}
<article class="job{{ if in $date "Present" }} current{{ end }}">
  <p class="job-date">{{ $date }}</p>
  <div class="job-main">
    <h3 class="job-title">{{ if .Get "url" }}<a href="{{ .Get "url" }}">{{ .Get "org" }}</a>{{ else }}{{ .Get "org" }}{{ end }}{{ with .Get "role" }}<span class="job-role"> · {{ . }}</span>{{ end }}</h3>
    {{ with .Get "meta" }}<p class="job-meta">{{ . }}</p>{{ end }}
    <div class="job-body">{{ .Inner | markdownify }}</div>
  </div>
</article>
